on:
    pull_request:
        branches: ["*"]
        # Release-please PRs only bump versions in CHANGELOG/manifest files.
        # The underlying code was already validated when the feature PRs merged
        # to main, so running the full CI matrix again is pure waste.
        paths-ignore:
            - "CHANGELOG.md"
            - ".release-please-manifest.json"
            - "release-please-config.json"
name: CI
permissions:
    contents: read
    pull-requests: read
jobs:
    checks:
        name: ${{ matrix.check }} (${{ matrix.os }})
        strategy:
            matrix:
                os: [macos-latest]
                check: [lint, vet, test, build]
                include:
                    # Formatting check only on macOS (Objective-C clang-format)
                    - os: macos-latest
                      check: formatting
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.head_ref }}

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: "go.mod"
                  cache: true

            # Install only, the lint step runs it
            - name: Setup Golangci
              if: matrix.check == 'lint'
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.12.2
                  install-only: true

            - name: Install just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
              with:
                  just-version: "1.54.0"

            # clang-format for the Objective-C sources, at the version oku.toml
            # pins. The PyPI wheel holds a static binary.
            - name: Install clang-format
              if: matrix.check == 'formatting'
              run: pipx install clang-format==21.1.8

            - name: Run just lint (macOS)
              if: matrix.check == 'lint' && runner.os == 'macOS'
              run: just lint

            - name: Run just fmt-check (macOS)
              if: matrix.check == 'formatting' && runner.os == 'macOS'
              run: just fmt-check

            - name: Run just vet (macOS)
              if: matrix.check == 'vet' && runner.os == 'macOS'
              run: just vet

            - name: Run just build (macOS)
              if: matrix.check == 'build' && runner.os == 'macOS'
              run: just build

            - name: Run just test-all (macOS)
              if: matrix.check == 'test' && runner.os == 'macOS'
              run: just test-all
