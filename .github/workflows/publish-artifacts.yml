on:
    workflow_call:
        inputs:
            release_tag:
                required: true
                type: string
            version_override:
                required: true
                type: string
            macos_bundle_version:
                required: true
                type: string
            macos_short_version:
                required: true
                type: string
        secrets:
            upload_token:
                required: false
            # TODO: Add these once Developer ID signing is set up
            # mac_developer_id_cert:
            #     required: false
            # mac_developer_id_key:
            #     required: false
            # mac_dev_id_keychain_pwd:
            #     required: false
            # apple_notary_api_issuer:
            #     required: false
            # apple_notary_api_key_id:
            #     required: false
            # apple_notary_api_key:
            #     required: false
            # apple_team_id:
            #     required: false

name: publish-artifacts

# Each job attests its zip with actions/attest-build-provenance, so
# `gh attestation verify <file> --repo y3owk1n/mimi` traces a download back to
# this workflow, this commit and this runner. The .sha256 files cannot show
# that. The same job writes them and uploads them with the same token as the
# zip, so they show a download is intact, not that the build was ours.
# Attesting needs `id-token: write` to sign and `attestations: write` to store,
# granted per job. A reusable workflow can only narrow what its caller granted,
# so release-please.yml grants the same on the job that calls this one. Without
# them there, signing here stops.

env:
    # Same floor as the #cgo flags, so the Go runtime/cgo shim matches.
    MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
    build-darwin-arm64-artifacts:
        runs-on: macos-latest
        permissions:
            contents: write # upload the release files
            id-token: write # attest-build-provenance: sign the provenance
            attestations: write # attest-build-provenance: store it on the repo
        steps:
            - uses: actions/checkout@v7

            # Install the toolchain CI builds and tests with, at the versions
            # oku.lock pins, so a release builds with the same go CI ran.
            - name: Setup the toolchain
              uses: y3owk1n/oku@v0.15.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Build mimi darwin arm64 artifact
              run: just release-ci-darwin arm64 ${{ inputs.version_override }}

            - name: Generate man pages
              run: go run ./cmd/genman build/man

            - name: Bundle mimi-darwin-arm64
              run: |
                  mkdir -p build/arm64/Mimi.app/Contents/{MacOS,Resources}
                  cp bin/mimi-darwin-arm64 build/arm64/Mimi.app/Contents/MacOS/mimi
                  chmod +x build/arm64/Mimi.app/Contents/MacOS/mimi
                  # cp resources/icon.icns build/arm64/Mimi.app/Contents/Resources/icon.icns
                  cp resources/Mimi.entitlements build/arm64/Mimi.app/Contents/Resources/Mimi.entitlements
                  mkdir -p build/arm64/share/man/man1
                  cp build/man/*.1 build/arm64/share/man/man1/
                  sed \
                    -e "s/BUNDLE_VERSION/${{ inputs.macos_bundle_version }}/g" \
                    -e "s/SHORT_VERSION/${{ inputs.macos_short_version }}/g" \
                    -e "s/BUILD_ID/${{ inputs.version_override }}/g" \
                    resources/Info.plist.template > build/arm64/Mimi.app/Contents/Info.plist
                  mkdir -p build/arm64/bin
                  cp bin/mimi-darwin-arm64 build/arm64/bin/mimi
                  chmod +x build/arm64/bin/mimi

            - name: Codesign mimi-darwin-arm64 (ad-hoc)
              run: |
                  # TODO: Replace ad-hoc with Developer ID + notarization when cert is set up
                  #       Remove this step and uncomment the "Developer ID sign & notarize" step below.
                  codesign --force --deep --sign - \
                    --entitlements resources/Mimi.entitlements \
                    --options runtime \
                    build/arm64/Mimi.app

            # # TODO: Enable when Developer ID cert is set up (and disable the ad-hoc step above)
            # - name: Developer ID sign & notarize
            #   uses: ./.github/actions/developer-id-notarize
            #   with:
            #     app-path: build/arm64/Mimi.app
            #     developer-id-identity: 'Developer ID Application: Your Name (TEAM_ID)'
            #     mac-developer-id-cert: ${{ secrets.mac_developer_id_cert }}
            #     mac-developer-id-key: ${{ secrets.mac_developer_id_key }}
            #     mac-dev-id-keychain-pwd: ${{ secrets.mac_dev_id_keychain_pwd }}
            #     apple-notary-api-issuer: ${{ secrets.apple_notary_api_issuer }}
            #     apple-notary-api-key-id: ${{ secrets.apple_notary_api_key_id }}
            #     apple-notary-api-key: ${{ secrets.apple_notary_api_key }}
            #     apple-team-id: ${{ secrets.apple_team_id }}

            - name: Package mimi-darwin-arm64
              run: |
                  cd build/arm64
                  zip -r ../../mimi-darwin-arm64.zip bin Mimi.app share
                  cd ../..

            - name: Generate darwin arm64 checksum
              run: |
                  shasum -a 256 mimi-darwin-arm64.zip | awk '{print $1}' > mimi-darwin-arm64.zip.sha256
                  ls -l mimi-darwin-arm64.zip mimi-darwin-arm64.zip.sha256

            - name: Attest darwin arm64 build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: mimi-darwin-arm64.zip

            - name: Upload darwin arm64 release artifacts
              env:
                  GH_TOKEN: ${{ secrets.upload_token || github.token }}
              run: |
                  gh release upload "${{ inputs.release_tag }}" mimi-darwin-arm64.zip mimi-darwin-arm64.zip.sha256 --clobber

    build-darwin-amd64-artifacts:
        runs-on: macos-15-intel
        permissions:
            contents: write # upload the release files
            id-token: write # attest-build-provenance: sign the provenance
            attestations: write # attest-build-provenance: store it on the repo
        steps:
            - uses: actions/checkout@v7

            # Install the toolchain CI builds and tests with, at the versions
            # oku.lock pins, so a release builds with the same go CI ran.
            - name: Setup the toolchain
              uses: y3owk1n/oku@v0.15.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Build mimi darwin amd64 artifact
              run: just release-ci-darwin amd64 ${{ inputs.version_override }}

            - name: Generate man pages
              run: go run ./cmd/genman build/man

            - name: Bundle mimi-darwin-amd64
              run: |
                  mkdir -p build/amd64/Mimi.app/Contents/{MacOS,Resources}
                  cp bin/mimi-darwin-amd64 build/amd64/Mimi.app/Contents/MacOS/mimi
                  chmod +x build/amd64/Mimi.app/Contents/MacOS/mimi
                  # cp resources/icon.icns build/amd64/Mimi.app/Contents/Resources/icon.icns
                  cp resources/Mimi.entitlements build/amd64/Mimi.app/Contents/Resources/Mimi.entitlements
                  mkdir -p build/amd64/share/man/man1
                  cp build/man/*.1 build/amd64/share/man/man1/
                  sed \
                    -e "s/BUNDLE_VERSION/${{ inputs.macos_bundle_version }}/g" \
                    -e "s/SHORT_VERSION/${{ inputs.macos_short_version }}/g" \
                    -e "s/BUILD_ID/${{ inputs.version_override }}/g" \
                    resources/Info.plist.template > build/amd64/Mimi.app/Contents/Info.plist
                  mkdir -p build/amd64/bin
                  cp bin/mimi-darwin-amd64 build/amd64/bin/mimi
                  chmod +x build/amd64/bin/mimi

            - name: Codesign mimi-darwin-amd64 (ad-hoc)
              run: |
                  # TODO: Replace ad-hoc with Developer ID + notarization when cert is set up
                  #       Remove this step and uncomment the "Developer ID sign & notarize" step below.
                  codesign --force --deep --sign - \
                    --entitlements resources/Mimi.entitlements \
                    --options runtime \
                    build/amd64/Mimi.app

            # # TODO: Enable when Developer ID cert is set up (and disable the ad-hoc step above)
            # - name: Developer ID sign & notarize
            #   uses: ./.github/actions/developer-id-notarize
            #   with:
            #     app-path: build/amd64/Mimi.app
            #     developer-id-identity: 'Developer ID Application: Your Name (TEAM_ID)'
            #     mac-developer-id-cert: ${{ secrets.mac_developer_id_cert }}
            #     mac-developer-id-key: ${{ secrets.mac_developer_id_key }}
            #     mac-dev-id-keychain-pwd: ${{ secrets.mac_dev_id_keychain_pwd }}
            #     apple-notary-api-issuer: ${{ secrets.apple_notary_api_issuer }}
            #     apple-notary-api-key-id: ${{ secrets.apple_notary_api_key_id }}
            #     apple-notary-api-key: ${{ secrets.apple_notary_api_key }}
            #     apple-team-id: ${{ secrets.apple_team_id }}

            - name: Package mimi-darwin-amd64
              run: |
                  cd build/amd64
                  zip -r ../../mimi-darwin-amd64.zip bin Mimi.app share
                  cd ../..

            - name: Generate darwin amd64 checksum
              run: |
                  shasum -a 256 mimi-darwin-amd64.zip | awk '{print $1}' > mimi-darwin-amd64.zip.sha256
                  ls -l mimi-darwin-amd64.zip mimi-darwin-amd64.zip.sha256

            - name: Attest darwin amd64 build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: mimi-darwin-amd64.zip

            - name: Upload darwin amd64 release artifacts
              env:
                  GH_TOKEN: ${{ secrets.upload_token || github.token }}
              run: |
                  gh release upload "${{ inputs.release_tag }}" mimi-darwin-amd64.zip mimi-darwin-amd64.zip.sha256 --clobber
