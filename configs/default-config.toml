# mimi — macOS window and space utility
# =============================================================================
# Documentation: https://github.com/y3owk1n/mimi
# Validate:      mimi config validate
# Re-create:     mimi config init
#
# Immediate actions (no daemon required, but faster when it is running):
#   mimi action focus_window
#   mimi action space <number>
#   mimi action move_window_to_space <number>
#
# When the daemon is running, actions are routed over a Unix socket
# (~/.local/share/mimi/mimi.sock by default) to avoid process startup cost.
# Every hook receives these environment variables:
#   mimi_EVENT        — event kind (e.g. "app_activate", "window_focus", "workspace_changed")
#   mimi_EVENT_ID     — unique event UUID
#   mimi_APP_NAME     — app display name
#   mimi_BUNDLE_ID    — bundle identifier (e.g. "com.apple.Safari")
#   mimi_PID          — app process ID
#   mimi_WINDOW_TITLE — focused window title (window events only)
#   mimi_TIMESTAMP    — RFC3339 timestamp
# =============================================================================

[settings]
# Log file path (supports ~/ expansion). Empty or omitted = console-only.
# log_file = "~/.local/share/mimi/mimi.log"

log_level = "info"
# Console log format: "text" (human-readable) or "json". The log file above is
# always JSON, whatever this is set to.
log_format = "text"
hook_timeout_secs = 10
hook_shell = "/bin/sh"
max_hook_workers = 4
pid_file = "~/.local/share/mimi/mimi.pid"
socket_file = "~/.local/share/mimi/mimi.sock"
# Resize debounce window in milliseconds. The on_window_resize hook fires
# after this much quiet time following the last AX window-resized event.
# Lower = more responsive, higher = fewer spurious fires during drag.
resize_debounce_ms = 250

# PATH the launchd-installed service runs with, and so the PATH every hook
# inherits. A login shell's PATH never reaches a launchd agent, so set this if
# a hook works from your terminal but does nothing under the installed service.
# It replaces the default below entirely rather than adding to it, and takes
# absolute directories only: "~" is not expanded here, and launchd would not
# expand it either.
#
# Nothing else reads this: run `mimi services install` after changing it, which
# re-renders the plist. A restart does not pick it up.
# service_path = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

[systray]
enabled = true
show_workspace_number = true

# =============================================================================
# Tiling
# =============================================================================
# mimi ships no layout. With enabled = true the daemon runs the program named
# by layout whenever a window opens, closes or gains focus, a space comes to
# the front, or (with relayout_on_drag) a window is dragged. The program gets
# every window on one display as JSON on stdin and prints the frames to apply
# on stdout; the daemon keeps whatever state it returns, per display and
# space. Guide: docs/TILING.md. Layouts to copy: examples/tiling/ (on Nix,
# share/mimi/examples/tiling in the package). Every key here is reloadable.
# =============================================================================

[tiling]
enabled = false
# A command line, run through hook_shell above. Required when enabled.
# layout = "~/.config/mimi/tiling/bsp.py"
# How the layout runs. "oneshot" starts a process per pass and reads it to
# exit. "resident" keeps one running and sends an input line per pass, so
# the layout skips its own startup. The shipped layouts work either way.
layout_mode = "oneshot"
# Settle a burst of window events into one run.
debounce_ms = 100
# Kill the layout past this.
timeout_secs = 5
# A window you move or resize runs the layout too: drag an edge to resize a
# split, drop a window on another to swap, in the shipped layouts.
relayout_on_drag = false
# Points between tiled windows and at the display's edges. Leave unset to
# follow the macOS tiled-window margin, the setting resize_window honours.
# gap = 12

# Move the frames into place over time instead of at once. The window server
# draws the animation from pictures of the windows, which needs the Screen
# Recording permission. The daemon asks for it only when this is on.
# duration_ms is 1 to 1000. easing is linear, ease-in, ease-out or ease-in-out.
[tiling.animation]
enabled = false
duration_ms = 150
easing = "ease-out"

# =============================================================================
# Borders
# =============================================================================
# Draw a ring around every window on the spaces in front, the way JankyBorders
# does. The focused window gets active_color and the rest get inactive_color.
# Each ring is a window of mimi's own, ordered under the window it belongs to,
# so it never covers another window. Needs Accessibility. Every key here is
# reloadable.
# =============================================================================

[border]
enabled = false
# Points, 1 to 32.
width = 4
# The window corner radius the ring follows on its inside. Leave unset to
# follow each window's own corners (macOS 26 and later; earlier releases get
# a document window's). Set a number to draw every ring alike; 0 is square.
# radius = 12
# #rrggbb or #rrggbbaa.
active_color = "#e2e2e3"
inactive_color = "#414141"

# =============================================================================
# Hooks
# =============================================================================
# Each hook is an array of entries. An entry can be either:
#
#   1) A plain string — the shell command to run:
#        on_window_focus = ["echo hello"]
#
#   2) An inline table with options:
#        on_window_focus = [
#          { run = "echo hello", app = "Slack", async = true }
#        ]
#
# Available entry fields:
#   run          — shell command (required)
#   app          — only fire when app name matches (glob: "Slack", "Code*")
#   bundle_id    — only fire when bundle ID matches exactly
#   title        — only fire when window title matches (regex)
#   timeout_secs — override global hook_timeout_secs for this entry
#   async        — run in background without blocking (default: false)
# =============================================================================

[hooks]

# ── Application Lifecycle ──────────────────────────────────────────────────────

# App comes to foreground.
# on_app_activate = [
#     "echo 'activated: $mimi_APP_NAME'"
# ]

# App loses foreground.
# on_app_deactivate = [
#     "echo 'deactivated: $mimi_APP_NAME'"
# ]

# App process started.
# on_app_launch = [
#     "echo 'launched: $mimi_APP_NAME'"
# ]

# App process terminated.
# on_app_quit = [
#     "echo 'quit: $mimi_APP_NAME'"
# ]

# App hidden (Cmd+H).
# on_app_hide = [
#     "echo 'hidden: $mimi_APP_NAME'"
# ]

# App unhidden.
# on_app_unhide = [
#     "echo 'unhidden: $mimi_APP_NAME'"
# ]

# ── Window Events (requires Accessibility permission) ─────────────────────────

# Focused window changed.
# on_window_focus = [
#     { run = "echo 'focus: $mimi_APP_NAME — $mimi_WINDOW_TITLE'", async = true }
# ]

# Active window title changed.
# on_window_title_change = [
#     "echo 'title: $mimi_WINDOW_TITLE'"
# ]

# New window opened.
# on_window_created = [
#     "echo 'window opened: $mimi_APP_NAME'"
# ]

# Window closed.
# on_window_closed = [
#     "echo 'window closed: $mimi_APP_NAME'"
# ]

# Window minimized to the Dock.
# on_window_minimize = [
#     "echo 'window minimized: $mimi_APP_NAME'"
# ]

# Minimized window restored.
# on_window_unminimize = [
#     "echo 'window restored: $mimi_APP_NAME'"
# ]

# Window finished resizing (debounced, fires once after resize ends).
# on_window_resize = [
#     "echo 'window resized: $mimi_APP_NAME — $mimi_WINDOW_TITLE'"
# ]

# Window finished moving (debounced the same way).
# on_window_move = [
#     "echo 'window moved: $mimi_APP_NAME — $mimi_WINDOW_TITLE'"
# ]

