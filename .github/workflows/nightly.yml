on:
    push:
        branches:
            - main

concurrency:
    group: nightly
    cancel-in-progress: true

permissions:
    contents: write

name: nightly

jobs:
    prepare-nightly-release:
        runs-on: ubuntu-latest
        outputs:
            release_tag: ${{ steps.meta.outputs.release_tag }}
            version_override: ${{ steps.meta.outputs.version_override }}
            macos_bundle_version: ${{ steps.meta.outputs.macos_bundle_version }}
            macos_short_version: ${{ steps.meta.outputs.macos_short_version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Compute nightly metadata
              id: meta
              run: |
                  echo "release_tag=nightly" >> "$GITHUB_OUTPUT"
                  TIMESTAMP="$(date -u +'%Y%m%d%H%M%S')"
                  echo "version_override=nightly-${TIMESTAMP}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  echo "macos_bundle_version=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
                  echo "macos_short_version=0.0.0" >> "$GITHUB_OUTPUT"

            - name: Ensure nightly release exists
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  SHORT_SHA="${GITHUB_SHA::7}"
                  COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
                  NOTES_FILE="$(mktemp)"
                  cat > "${NOTES_FILE}" <<EOF
                  The nightly workflow builds this pre-release from the latest commit on \`main\`.

                  > [!WARNING]
                  > This is a nightly build, not a tagged release. It can include unfinished changes and regressions. Install a tagged release if you need mimi to keep working day to day.

                  ### Build details

                  - Commit: [\`${SHORT_SHA}\`](${COMMIT_URL})
                  - Branch: \`main\`
                  - Full SHA: \`${GITHUB_SHA}\`

                  ### Artifacts

                  - \`mimi-darwin-arm64.zip\` for macOS on Apple Silicon
                  - \`mimi-darwin-amd64.zip\` for macOS on Intel

                  ### Feedback

                  If a nightly breaks something, include the commit above when you file an issue. It tells us which change to look at.
                  EOF

                  git tag -f nightly "${GITHUB_SHA}"
                  git push origin refs/tags/nightly:refs/tags/nightly --force

                  if gh release view nightly &>/dev/null; then
                      gh release edit nightly \
                        --target "${GITHUB_SHA}" \
                        --notes-file "${NOTES_FILE}" \
                        --prerelease \
                        --latest=false
                  else
                      gh release create nightly \
                        --target "${GITHUB_SHA}" \
                        --title "Mimi Nightly" \
                        --notes-file "${NOTES_FILE}" \
                        --prerelease \
                        --latest=false
                  fi

    publish-nightly-artifacts:
        needs: prepare-nightly-release
        # Build-provenance permissions, required here because a called workflow
        # can only narrow what its caller granted — see the header comment in
        # publish-artifacts.yml. Nightly zips are published for people to
        # download, so they are attested on the same terms as a tagged release.
        permissions:
            contents: write
            id-token: write
            attestations: write
        uses: ./.github/workflows/publish-artifacts.yml
        with:
            release_tag: ${{ needs.prepare-nightly-release.outputs.release_tag }}
            version_override: ${{ needs.prepare-nightly-release.outputs.version_override }}
            macos_bundle_version: ${{ needs.prepare-nightly-release.outputs.macos_bundle_version }}
            macos_short_version: ${{ needs.prepare-nightly-release.outputs.macos_short_version }}
        secrets:
            upload_token: ${{ github.token }}
            # # TODO: Add these once Developer ID signing is set up
            # mac_developer_id_cert: ${{ secrets.mac_developer_id_cert }}
            # mac_developer_id_key: ${{ secrets.mac_developer_id_key }}
            # mac_dev_id_keychain_pwd: ${{ secrets.mac_dev_id_keychain_pwd }}
            # apple_notary_api_issuer: ${{ secrets.apple_notary_api_issuer }}
            # apple_notary_api_key_id: ${{ secrets.apple_notary_api_key_id }}
            # apple_notary_api_key: ${{ secrets.apple_notary_api_key }}
            # apple_team_id: ${{ secrets.apple_team_id }}
